<script>

/* =========================
   المتغيرات
========================= */

let selectedFiles = [];

let reportsData = [];

let objectURLs = [];

let excelWorkbook = null;

let excelRows = [];


/* =========================
   العناصر
========================= */

const fileInput =
document.getElementById(&quot;fileInput&quot;);

const dropBox =
document.getElementById(&quot;dropBox&quot;);

const selectedFileDiv =
document.getElementById(&quot;selectedFile&quot;);

const status =
document.getElementById(&quot;status&quot;);

const excelInput =
document.getElementById(&quot;excelInput&quot;);

const excelBtn =
document.getElementById(&quot;excelBtn&quot;);

const excelInfo =
document.getElementById(&quot;excelInfo&quot;);

const searchExcelBtn =
document.getElementById(&quot;searchExcelBtn&quot;);


/* =========================
   اختيار المحادثات
========================= */

dropBox.addEventListener(
&quot;click&quot;,
function(){

  fileInput.click();

});


fileInput.addEventListener(
&quot;change&quot;,
function(){

  if(
    fileInput.files &amp;&amp;
    fileInput.files.length
  ){

    useFiles(
      Array.from(
        fileInput.files
      )
    );

  }

});


function useFiles(files){

  selectedFiles =
  files;

  selectedFileDiv.innerHTML =
  &quot;<b>عدد الملفات المختارة: &quot; +
  selectedFiles.length +
  &quot;</b><br><br>&quot;;

  selectedFiles.forEach(
  function(file,index){

    selectedFileDiv.innerHTML +=
    '<div class=&quot;fileItem&quot;>' +
    (index + 1) +
    &quot; - &quot; +
    file.name +
    &quot;<br>&quot; +
    Math.round(
      file.size / 1024
    ) +
    &quot; KB&quot; +
    &quot;</div>&quot;;

  });

}


/* =========================
   السحب والإفلات
========================= */

dropBox.addEventListener(
&quot;dragover&quot;,
function(e){

  e.preventDefault();

  dropBox.classList.add(
    &quot;drag&quot;
  );

});


dropBox.addEventListener(
&quot;dragleave&quot;,
function(){

  dropBox.classList.remove(
    &quot;drag&quot;
  );

});


dropBox.addEventListener(
&quot;drop&quot;,
function(e){

  e.preventDefault();

  dropBox.classList.remove(
    &quot;drag&quot;
  );

  if(
    e.dataTransfer.files &amp;&amp;
    e.dataTransfer.files.length
  ){

    useFiles(
      Array.from(
        e.dataTransfer.files
      )
    );

  }

});


/* =========================
   تحويل الأرقام العربية
========================= */

function normalizeNumbers(text){

  return String(text)

  .replace(
    /[٠-٩]/g,
    d =>
    &quot;٠١٢٣٤٥٦٧٨٩&quot;.indexOf(d)
  )

  .replace(
    /[۰-۹]/g,
    d =>
    &quot;۰۱۲۳۴۵۶۷۸۹&quot;.indexOf(d)
  );

}


/* =========================
   تنظيف النص
========================= */

function cleanText(text){

  return String(text)

  .replace(
    /[\u200e\u200f]/g,
    &quot;&quot;
  )

  .replace(
    /[\u202a-\u202e\u2066-\u2069]/g,
    &quot;&quot;
  )

  .replace(
    /\ufeff/g,
    &quot;&quot;
  )

  .trim();

}


/* =========================
   رقم البلاغ
========================= */

function getReportNumber(text){

  const m =
  normalizeNumbers(text)
  .match(
    /INC-\d{2}-\d{2}-\d+/i
  );

  return m
  ?
  m[0].toUpperCase()
  :
  &quot;&quot;;

}


/* =========================
   تنظيف رقم البلاغ
========================= */

function normalizeReportNo(value){

  let text =
  normalizeNumbers(
    String(value || &quot;&quot;)
  )

  .replace(
    /[\u200e\u200f]/g,
    &quot;&quot;
  )

  .replace(
    /[–—−]/g,
    &quot;-&quot;
  )

  .replace(
    /\s+/g,
    &quot;&quot;
  )

  .trim()

  .toUpperCase();


  const m =
  text.match(
    /INC-\d{2}-\d{2}-\d+/i
  );


  return m
  ?
  m[0].toUpperCase()
  :
  text;

}


/* =========================
   التاريخ
========================= */

function getDate(text){

  const m =
  normalizeNumbers(text)
  .match(
    /(\d{1,2})\/(\d{1,2})\/(\d{4})/
  );


  if(!m)
  return &quot;&quot;;


  return (
    String(m[1]).padStart(2,&quot;0&quot;)
    +
    &quot;/&quot;
    +
    String(m[2]).padStart(2,&quot;0&quot;)
    +
    &quot;/&quot;
    +
    m[3]
  );

}


/* =========================
   الجوال من واتساب
========================= */

function getPhone(text){

  const lines =
  text.split(
    /\r?\n/
  );


  for(
    let line
    of lines
  ){

    if(
      line.includes(
        &quot;مشرف بلاغات&quot;
      )
    ){

      continue;

    }


    line =
    normalizeNumbers(
      cleanText(line)
    );


    const m =
    line.match(
      /(?:\+?966[\s\-]?\d{2}[\s\-]?\d{3}[\s\-]?\d{4}|05\d{8})/
    );


    if(m){

      return m[0];

    }

  }


  return &quot;&quot;;

}


/* =========================
   استخراج المحادثة
========================= */

function getAllMessages(text){

  const messages =
  [];


  const lines =
  text.split(
    /\r?\n/
  );


  let currentMessage =
  null;


  for(
    const rawLine
    of lines
  ){

    const line =
    cleanText(
      rawLine
    );


    if(!line){

      if(currentMessage){

        currentMessage.text +=
        &quot;\n&quot;;

      }

      continue;

    }


    const normalized =
    normalizeNumbers(
      line
    );


    const m =
    normalized.match(

      /^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:[،,]\s*|\s+)(\d{1,2}:\d{2})\s*([صمAPMapm.]*)\s*-\s*(.+?):\s*(.*)$/

    );


    if(m){

      const sender =
      cleanText(
        m[6]
      );


      let message =
      cleanText(
        m[7]
      );


      /*
      تجاهل إشعار التشفير
      */

      if(
        line.includes(
          &quot;الرسائل والمكالمات مشفرة&quot;
        )
      ){

        currentMessage =
        null;

        continue;

      }


      /*
      تجاهل أسطر الصور
      */

      if(
        /IMG-.*\.(jpg|jpeg|png|webp)/i
        .test(message)

        ||

        message.includes(
          &quot;الملف مرفق&quot;
        )
      ){

        currentMessage =
        null;

        continue;

      }


      /*
      إزالة عبارة مشرف بلاغات
      من النص إن ظهرت داخله
      */

      message =
      message.replace(
        /مشرف بلاغات\s*:?\s*/g,
        &quot;&quot;
      );


      currentMessage = {

        time:
        m[4] +
        (
          m[5]
          ?
          &quot; &quot; + m[5]
          :
          &quot;&quot;
        ),

        sender:
        sender,

        text:
        message

      };


      messages.push(
        currentMessage
      );


      continue;

    }


    /*
    تكملة الرسالة
    متعددة الأسطر
    */

    if(
      currentMessage
    ){

      const extra =
      line.replace(
        /مشرف بلاغات\s*:?\s*/g,
        &quot;&quot;
      );


      currentMessage.text +=
      &quot;\n&quot; +
      extra;

    }

  }


  return messages.filter(
  function(msg){

    return (
      msg.text &amp;&amp;
      msg.text.trim()
    );

  });

}

================================================= */

function normalizeColumnName(value){

  return String(
    value || &quot;&quot;
  )

  .replace(
    /[\u200e\u200f]/g,
    &quot;&quot;
  )

  .replace(
    /[أإآ]/g,
    &quot;ا&quot;
  )

  .replace(
    /ة/g,
    &quot;ه&quot;
  )

  .replace(
    /ى/g,
    &quot;ي&quot;
  )

  .replace(
    /[^\u0600-\u06FFa-zA-Z0-9]/g,
    &quot;&quot;
  )

  .toLowerCase()

  .trim();

}


/* =========================
   العثور على العمود
========================= */

function findColumn(row,names){

  if(!row){

    return null;

  }


  const keys =
  Object.keys(
    row
  );


  for(
    const key
    of keys
  ){

    if(
      key ===
      &quot;__sheetName&quot;
    ){

      continue;

    }


    const cleanKey =
    normalizeColumnName(
      key
    );


    for(
      const name
      of names
    ){

      const cleanName =
      normalizeColumnName(
        name
      );


      if(
        cleanKey === cleanName

        ||

        cleanKey.includes(
          cleanName
        )

        ||

        cleanName.includes(
          cleanKey
        )
      ){

        return key;

      }

    }

  }


  return null;

}

/* =========================
   البحث عن البلاغ في Excel
========================= */

function searchReportInExcel(
  reportNumber
){

  if(
    !reportNumber ||
    excelRows.length === 0
  ){

    return null;

  }


  const target =
  normalizeReportNo(
    reportNumber
  );


  for(
    const row
    of excelRows
  ){

    let reportFound =
    false;


    /*
    البحث عن رقم البلاغ
    في الصف
    */

    for(
      const key
      of Object.keys(row)
    ){

      if(
        key ===
        &quot;__sheetName&quot;
      ){

        continue;

      }


      const value =
      normalizeReportNo(
        row[key]
      );


      if(
        value ===
        target
      ){

        reportFound =
        true;

        break;

      }

    }


    if(
      !reportFound
    ){

      continue;

    }


    /*
    اسم المبلغ
    */

    const reporterColumn =
    findColumn(
      row,
      [

        &quot;اسم المبلغ&quot;,

        &quot;اسم المبلّغ&quot;,

        &quot;اسم مقدم البلاغ&quot;,

        &quot;اسم مقدم الطلب&quot;,

        &quot;اسم المستفيد&quot;,

        &quot;اسم العميل&quot;

      ]
    );


    /*
    رقم الجوال
    */

    const phoneColumn =
    findColumn(
      row,
      [

        &quot;رقم الجوال&quot;,

        &quot;رقم جوال&quot;,

        &quot;الجوال&quot;,

        &quot;جوال&quot;,

        &quot;رقم الهاتف&quot;,

        &quot;رقم التواصل&quot;,

        &quot;رقم جوال المبلغ&quot;

      ]
    );


    /*
    الحي
    */

    const hoodColumn =
    findColumn(
      row,
      [

        &quot;الحي&quot;,

        &quot;اسم الحي&quot;,

        &quot;الحي السكني&quot;

      ]
    );


    return {

      reporter:

      reporterColumn
      ?
      String(
        row[
          reporterColumn
        ] || &quot;&quot;
      ).trim()
      :
      &quot;&quot;,


      phone:

      phoneColumn
      ?
      String(
        row[
          phoneColumn
        ] || &quot;&quot;
      ).trim()
      :
      &quot;&quot;,


      hood:

      hoodColumn
      ?
      String(
        row[
          hoodColumn
        ] || &quot;&quot;
      ).trim()
      :
      &quot;&quot;

    };

  }


  return null;

}

/* =========================
   قراءة ملف واحد
========================= */

async function readOneFile(file){

  let zip;


  try{


    zip =
    await JSZip.loadAsync(
      file
    );


  }

  catch(error){


    /*
    في حال كان TXT مباشرة
    */

    const text =
    await file.text();


    const messages =
    getAllMessages(
      text
    );


    return {

      fileName:
      file.name,


      reportNo:
      getReportNumber(
        text
      ),


      date:
      getDate(
        text
      ),


      reporter:
      &quot;&quot;,


      phone:
      getPhone(
        text
      ),


      hood:
      &quot;&quot;,


      messages:
      messages,


      satisfaction:
      analyzeSatisfaction(
        messages
      ),


      imageEntries:
      [],


      excelFound:
      false

    };

  }


  let txtEntry =
  null;


  const imageEntries =
  [];


  zip.forEach(
  function(path,entry){


    if(
      entry.dir
    ){

      return;

    }


    const lower =
    path.toLowerCase();


    if(
      lower.endsWith(
        &quot;.txt&quot;
      )
    ){

      if(
        !txtEntry
      ){

        txtEntry =
        entry;

      }

    }


    if(
      /\.(jpg|jpeg|png|webp)$/i
      .test(
        lower
      )
    ){

      imageEntries.push(
        entry
      );

    }

  });


  if(
    !txtEntry
  ){

    return null;

  }


  const text =
  await txtEntry.async(
    &quot;string&quot;
  );


  const messages =
  getAllMessages(
    text
  );


  /*
  ترتيب الصور
  */

  imageEntries.sort(
  function(a,b){


    function getNo(entry){

      const m =
      entry.name.match(
        /WA(\d+)/i
      );


      return m
      ?
      Number(
        m[1]
      )
      :
      999999;

    }


    return (
      getNo(a) -
      getNo(b)
    );

  });


  return {

    fileName:
    file.name,


    reportNo:
    getReportNumber(
      text
    ),


    date:
    getDate(
      text
    ),


    reporter:
    &quot;&quot;,


    phone:
    getPhone(
      text
    ),


    hood:
    &quot;&quot;,


    messages:
    messages,


    satisfaction:
    analyzeSatisfaction(
      messages
    ),


    imageEntries:
    imageEntries.slice(
      0,
      3
    ),


    excelFound:
    false

  };

}

async function createPDF(data){

  const report =
  document.getElementById(
    &quot;report&quot;
  );


  /*
  انتظار تحميل الصور
  */

  const imgs =
  Array.from(
    report.querySelectorAll(
      &quot;img&quot;
    )
  );


  await Promise.all(

    imgs.map(
    img =>

      new Promise(
      resolve => {


        if(
          img.complete
        ){

          resolve();

        }

        else{


          img.onload =
          resolve;


          img.onerror =
          resolve;

        }

      })

    )

  );


  /*
  تصوير التقرير
  */

  const canvas =
  await html2canvas(
    report,
    {

      scale:
      2,

      backgroundColor:
      &quot;#ffffff&quot;,

      useCORS:
      true

    }
  );


  const imgData =
  canvas.toDataURL(
    &quot;image/jpeg&quot;,
    .96
  );


  const {
    jsPDF
  } =
  window.jspdf;


  const pdf =
  new jsPDF(
    &quot;p&quot;,
    &quot;mm&quot;,
    &quot;a4&quot;
  );


  const pageW =
  210;


  const pageH =
  297;


  let w =
  pageW;


  let h =
  canvas.height *
  w /
  canvas.width;


  /*
  صفحة واحدة
  */

  if(
    h >
    pageH
  ){

    const scale =
    pageH /
    h;


    h =
    pageH;


    w *=
    scale;

  }


  const x =
  (
    pageW -
    w
  ) / 2;


  pdf.addImage(
    imgData,
    &quot;JPEG&quot;,
    x,
    0,
    w,
    h
  );


  /*
  ==========================================
  اسم ملف PDF

  إذا المستفيد راضي:
  تقرير_INC-26-08-223727_✅.pdf

  إذا غير راضي:
  تقرير_INC-26-08-223727.pdf
  ==========================================
  */

  let fileName;


  if(
    data.reportNo
  ){

    if(
      data.satisfaction ===
      &quot;satisfied&quot;
    ){

      fileName =

      &quot;تقرير_&quot; +

      data.reportNo +

      &quot;_✅.pdf&quot;;

    }

    else{


      fileName =

      &quot;تقرير_&quot; +

      data.reportNo +

      &quot;.pdf&quot;;

    }

  }

  else{


    fileName =
    &quot;تقرير_واتساب.pdf&quot;;

  }


  /*
  تنزيل الملف بالاسم الجديد
  */

  pdf.save(
    fileName
  );

}

<script>
function showTab(id){
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function clean(v){return String(v||"").trim()}
async function copyToClipboard(text){
  // 1) طريقة الحافظة الحديثة (تعمل فقط في صفحات https/localhost)
  try{
    if(navigator.clipboard&&window.isSecureContext){
      await navigator.clipboard.writeText(text);
      return true;
    }
  }catch(e){}
  // 2) طريقة execCommand القديمة (تعمل غالباً حتى في الملفات المحلية content://,file://)
  try{
    const ta=document.createElement("textarea");
    ta.value=text;
    ta.style.position="fixed";ta.style.top="0";ta.style.left="0";
    ta.style.opacity="0";
    document.body.appendChild(ta);
    ta.focus();ta.select();ta.setSelectionRange(0,text.length);
    const ok=document.execCommand("copy");
    document.body.removeChild(ta);
    if(ok)return true;
  }catch(e){}
  // 3) كملاذ أخير: نافذة فيها النص جاهز للتحديد والنسخ يدوياً
  window.prompt("تعذر النسخ التلقائي في هذا المتصفح — النص محدد، اضغط نسخ (Copy) من القائمة:",text);
  return false;
}
function cleanKey(v){return clean(v).replace(/\s/g,'').toLowerCase()}
function findCol(row,names){
  const keys=Object.keys(row||{});
  for(const n of names){
    const f=keys.find(k=>cleanKey(k)===cleanKey(n));
    if(f)return f;
  }
  return null;
}
function phoneFix(p){
  p=clean(p).replace(/\D/g,'');
  if(p.startsWith('966'))return p;
  if(p.startsWith('05'))return '966'+p.substring(1);
  if(p.startsWith('5')&&p.length===9)return '966'+p;
  return p;
}
function readExcelFile(file,cb,msgEl){
  const r=new FileReader();
  r.onload=function(e){
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""});
      cb(rows);
    }catch(err){ if(msgEl) msgEl.textContent="خطأ في قراءة Excel"; else alert("خطأ في قراءة Excel"); }
  };
  r.readAsArrayBuffer(file);
}
function normalizeREQ(raw){
  let s=clean(raw).toUpperCase().replace(/\s+/g,'').replace(/REO/g,'REQ');
  const m=s.match(/REQ-?\d{2}-?\d{2}-?\d{5,6}/);
  if(!m)return "";
  return m[0].replace(/^REQ-?/,'REQ-').replace(/REQ-(\d{2})-?(\d{2})-?(\d+)/,'REQ-$1-$2-$3');
}
function normalizeINC(raw){
  let s=clean(raw).toUpperCase().replace(/\s+/g,'');
  const m=s.match(/INC-?\d{2}-?\d{2}-?\d{5,6}/);
  if(!m)return "";
  return m[0].replace(/^INC-?/,'INC-').replace(/INC-(\d{2})-?(\d{2})-?(\d+)/,'INC-$1-$2-$3');
}

/* ============ تحليل ============ */
let oReqRows=[],oIncRows=[],oFile=null;
let oSaved=JSON.parse(localStorage.getItem("oSaved")||"[]");
function o_count(){document.getElementById("o_counter").textContent="عدد المحفوظات: "+oSaved.length}
o_count();

document.getElementById("o_excelReq").addEventListener("change",e=>{
  const f=e.target.files[0]; if(!f)return;
  readExcelFile(f,rows=>{oReqRows=rows;document.getElementById("o_status").textContent="تم تحميل طلبات: "+rows.length},document.getElementById("o_status"));
});
document.getElementById("o_excelInc").addEventListener("change",e=>{
  const f=e.target.files[0]; if(!f)return;
  readExcelFile(f,rows=>{oIncRows=rows;document.getElementById("o_status").textContent="تم تحميل بلاغات: "+rows.length},document.getElementById("o_status"));
});
document.getElementById("o_file").addEventListener("change",e=>{
  oFile=e.target.files[0]||null;
  const note=document.getElementById("o_pdfNote");
  if(oFile&&oFile.type==="application/pdf"){
    const req=normalizeREQ(oFile.name),inc=normalizeINC(oFile.name);
    if(req||inc){note.textContent="📄 تم العثور على رقم في اسم ملف الـPDF: "+(req||inc);note.classList.remove("hidden");}
    else{note.textContent="📄 لم يتم العثور على رقم بلاغ/طلب في اسم ملف الـPDF";note.classList.remove("hidden");}
  }else{
    note.classList.add("hidden");note.textContent="";
  }
});

async function o_analyze(){
  let raw=document.getElementById("o_manual").value, req="", inc="";
  if(raw){req=normalizeREQ(raw);inc=normalizeINC(raw)}
  else{
    if(!oFile){alert("أدخل رقم أو ارفع صورة أو PDF");return}
    if(oFile.type==="application/pdf"){
      req=normalizeREQ(oFile.name); inc=normalizeINC(oFile.name);
    }else if(oFile.type.startsWith("video/")){
      alert("تحليل الرقم يعمل على الصور و PDF فقط");return
    }else{
      document.getElementById("o_status").textContent="جاري قراءة الصورة...";
      const res=await Tesseract.recognize(oFile,"eng",{logger:m=>{if(m.progress)document.getElementById("o_status").textContent="جاري التحليل "+Math.round(m.progress*100)+"%"}});
      req=normalizeREQ(res.data.text); inc=normalizeINC(res.data.text);
    }
  }
  if(!req&&!inc){alert("لم يتم استخراج رقم صحيح");return}
  let row=null,type="",saveKey=req||inc;
  if(req){
    row=oReqRows.find(r=>normalizeREQ(r[findCol(r,["رقم الطلب","رقمالطلب"])])===req);
    if(row)type="طلب";
  }
  if(!row&&inc){
    row=oIncRows.find(r=>normalizeINC(r[findCol(r,["رقم البلاغ","رقمالبلاغ"])])===inc);
    if(row)type="بلاغ";
  }
  if(!row){document.getElementById("o_status").textContent="❌ غير موجود في Excel";return}

  const linkCol=type==="طلب"?findCol(row,["الموقع","موقع الطلب"]):findCol(row,["موقع البلاغ","الموقع"]);
  const benefCol=findCol(row,["رقم المستفيد","المستفيد"]);
  const phoneCol=findCol(row,["رقم الجوال","رقم جوال المستفيد","الجوال"]);
  const muniCol=findCol(row,["البلدية الفرعية"]);

  document.getElementById("o_no").value=saveKey;
  document.getElementById("o_link").value=clean(row[linkCol]);
  document.getElementById("o_benef").value=clean(row[benefCol]);
  document.getElementById("o_phone").value=clean(row[phoneCol]);
  document.getElementById("o_muni").value=clean(row[muniCol]);

  // ===== حفظ تلقائي =====
  if(!oSaved.some(x=>x["رقم"]===saveKey)){
    oSaved.push({"رقم":saveKey,"البلدية الفرعية":clean(row[muniCol]),"الموقع":clean(row[linkCol]),"رقم المستفيد":clean(row[benefCol]),"رقم الجوال":clean(row[phoneCol]),"النوع":type,"تاريخ الحفظ":new Date().toLocaleString("ar-SA")});
    localStorage.setItem("oSaved",JSON.stringify(oSaved));o_count();
  }
  document.getElementById("o_status").textContent="✅ تم العثور ("+type+") — تم الحفظ تلقائياً";
}

function o_buildText(){
  return `رقم الطلب/البلاغ: ${document.getElementById("o_no").value}
رقم المستفيد: ${document.getElementById("o_benef").value}
رقم الجوال: ${document.getElementById("o_phone").value}
البلدية الفرعية: ${document.getElementById("o_muni").value}
الموقع: ${document.getElementById("o_link").value}`;
}

async function o_copyText(){
  const text=o_buildText();
  if(!document.getElementById("o_no").value){alert("لا يوجد بيانات لنسخها — حلل الملف أولاً");return}
  const ok=await copyToClipboard(text);
  if(ok)document.getElementById("o_status").textContent="✅ تم نسخ النص — الصقه في واتساب مع إرفاق الملف يدوياً";
}

async function o_share(){
  const text=o_buildText();

  if(oFile&&navigator.canShare&&navigator.canShare({files:[oFile]})){
    // مشاركة الملف (صورة / فيديو / PDF) مع النص في نفس الرسالة
    await navigator.share({files:[oFile],text});
  }else{
    // بعض المتصفحات لا تدعم إرفاق الملف مباشرة عبر رابط واتساب،
    // لذلك ننسخ النص وننبه المستخدم لإرفاق الملف يدوياً بعد فتح واتساب
    await copyToClipboard(text);
    if(oFile){alert("تم نسخ النص. سيتم فتح واتساب — الرجاء إرفاق ملف "+oFile.name+" يدوياً من زر 📎 داخل واتساب لأن هذا المتصفح لا يدعم إرفاق الملف مباشرة.");}
    location.href="https://wa.me/?text="+encodeURIComponent(text);
  }
}
function o_export(){exportRows(oSaved,"التحليل_المحفوظ.xlsx","التحليل")}



async function o_copyNo(){
  const no=clean(document.getElementById("o_no").value);
  if(!no){alert("لا يوجد رقم لنسخه — حلل الملف أولاً");return}
  document.getElementById("o_manual").value=no;
  await copyToClipboard(no);
  document.getElementById("o_status").textContent="✅ تم نسخ الرقم "+no+" إلى مربع البحث";
}


/* ============ البلاغات ============ */
let rRows=[],rRow=null,rImgData=null,rImgFile=null;
let rSaved=JSON.parse(localStorage.getItem("rSaved")||"[]");

document.getElementById("r_excel").addEventListener("change",e=>{
  const f=e.target.files[0];if(!f)return;
  readExcelFile(f,rows=>{rRows=rows;document.getElementById("r_form").classList.remove("hidden");document.getElementById("r_status").textContent="تم تحميل: "+rows.length});
});
document.getElementById("r_img").addEventListener("change",e=>{
  rImgFile=e.target.files[0];if(!rImgFile)return;
  const fr=new FileReader();fr.onload=ev=>{rImgData=ev.target.result;document.getElementById("r_previewImg").src=rImgData;document.getElementById("r_previewBox").classList.remove("hidden")};fr.readAsDataURL(rImgFile);
});
function r_removeImg(){rImgData=null;rImgFile=null;document.getElementById("r_img").value="";document.getElementById("r_previewBox").classList.add("hidden")}

function r_search(){
  const no=clean(document.getElementById("r_no").value);if(!no){alert("اكتب رقم البلاغ");return}
  rRow=rRows.find(r=>clean(r[findCol(r,["رقم البلاغ","رقمالبلاغ"])])===no);
  if(!rRow){alert("لم يتم العثور");return}

  document.getElementById("r_desc").value=clean(rRow[findCol(rRow,["الوصف","وصف البلاغ"])]);
  document.getElementById("r_note").value=clean(rRow[findCol(rRow,["الملاحظات","ملاحظات"])]);
  document.getElementById("r_result").classList.remove("hidden");

  // ===== حفظ تلقائي =====
  r_save();
}

function r_save(){
  if(!rRow)return;
  const no=clean(rRow[findCol(rRow,["رقم البلاغ","رقمالبلاغ"])]);
  const phone=clean(rRow[findCol(rRow,["رقم الجوال","الجوال","رقم جوال المستفيد"])]);
  const desc=clean(rRow[findCol(rRow,["الوصف","وصف البلاغ"])]);
  const note=document.getElementById("r_note").value;

  if(!rSaved.some(x=>x["رقم البلاغ"]===no)){
    rSaved.push({"رقم البلاغ":no,"الوصف":desc,"الملاحظة":note,"رقم الجوال":phone,"تاريخ الحفظ":new Date().toLocaleString("ar-SA")});
    localStorage.setItem("rSaved",JSON.stringify(rSaved));
    document.getElementById("r_status").textContent="✅ تم الحفظ تلقائياً";
  }
}

function r_msg(){
  const no=clean(rRow[findCol(rRow,["رقم البلاغ","رقمالبلاغ"])]);
  return `السلام عليكم ورحمة الله وبركاته

لديكم بلاغ رقم: ${no}

الوصف:
${document.getElementById("r_desc").value}

الملاحظة:
${document.getElementById("r_note").value}`;
}

function r_whatsapp(){
  if(!rRow){alert("ابحث أولاً");return}
  const p=phoneFix(rRow[findCol(rRow,["رقم الجوال","الجوال","رقم جوال المستفيد"])]);
  if(!p){alert("لا يوجد رقم جوال");return}

  // حفظ تلقائي عند الإرسال
  r_save();
  location.href="https://wa.me/"+p+"?text="+encodeURIComponent(r_msg());
}

async function r_share(){
  if(!rRow){alert("ابحث أولاً");return}
  r_save();
  if(rImgFile&&navigator.canShare&&navigator.canShare({files:[rImgFile]})){await navigator.share({files:[rImgFile],text:r_msg()})}
  else if(navigator.share){await navigator.share({text:r_msg()})}
  else r_copy();
}

async function r_copy(){
  const ok=await copyToClipboard(r_msg());
  if(ok)document.getElementById("r_status").textContent="تم النسخ ✅";
}

function r_downloadImg(){
  if(!rImgData){alert("ارفق صورة");return}
  const a=document.createElement("a");a.href=rImgData;a.download="بلاغ.jpg";a.click();
}

function r_export(){exportRows(rSaved,"البلاغات_المحفوظة.xlsx","البلاغات")}


/* ============ الطلبات ============ */
let qRows=[];
let qSent=JSON.parse(localStorage.getItem("qSent")||"[]");

document.getElementById("q_excel").addEventListener("change",e=>{
  const f=e.target.files[0];if(!f)return;
  readExcelFile(f,rows=>{qRows=rows;document.getElementById("q_status").textContent="تم إرفاق الملف بنجاح — عدد السجلات: "+rows.length;document.getElementById("q_searchBox").classList.remove("hidden")},document.getElementById("q_status"));
});

function q_searchData(){
  const q=clean(document.getElementById("q_search").value).toLowerCase();
  const box=document.getElementById("q_results");box.innerHTML="";
  if(!q){box.innerHTML="<p class='note'>اكتب كلمة للبحث</p>";return}
  const rows=qRows.filter(r=>Object.values(r).some(v=>clean(v).toLowerCase().includes(q)));
  if(!rows.length){box.innerHTML="<p class='note'>لا توجد نتائج</p>";return}

  rows.forEach(row=>{
    const order=clean(row[findCol(row,["رقم الطلب","رقمالطلب"])]);
    const desc=clean(row[findCol(row,["وصف الطلب","وصفالطلب","الوصف"])]);
    const name=clean(row[findCol(row,["اسم المستفيد","إسم المستفيد"])]);
    const phone=phoneFix(row[findCol(row,["رقم جوال المستفيد","رقم الجوال","الجوال","رقم الهاتف"])]);

    const msg=`السلام عليكم ورحمة الله وبركاته

لديكم طلب رقم ${order}

وصف الطلب:
${desc}

نأمل إرسال صورة للملاحظة`;

    const div=document.createElement("div");div.className="item";
    div.innerHTML=`<div><b>رقم الطلب:</b> ${order}</div><div><b>اسم المستفيد:</b> ${name}</div><div><b>الجوال:</b> ${phone||"غير موجود"}</div><div><b>وصف الطلب:</b> ${desc}</div>`;

    const b=document.createElement("button");b.className="btn-green";b.textContent="إرسال واتساب";
    b.onclick=function(){
      if(!phone){alert("لا يوجد رقم جوال");return}

      // ===== حفظ تلقائي =====
      if(!qSent.some(x=>x["رقم الطلب"]===order)){
        qSent.push({"رقم الطلب":order,"اسم المستفيد":name,"الجوال":phone,"وصف الطلب":desc,"تاريخ الإرسال":new Date().toLocaleDateString("ar-SA"),"وقت الإرسال":new Date().toLocaleTimeString("ar-SA")});
        localStorage.setItem("qSent",JSON.stringify(qSent));
      }

      location.href="https://wa.me/"+phone+"?text="+encodeURIComponent(msg);
    };
    div.appendChild(b);box.appendChild(div);
  });
}

function q_export(){exportRows(qSent,"الطلبات_المحفوظة.xlsx","الطلبات")}


/* ============ تصدير Excel ============ */
function exportRows(rows,file,sheet){
  if(!rows||!rows.length){alert("لا يوجد بيانات محفوظة");return}
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),sheet||"Sheet1");
  XLSX.writeFile(wb,file);
}
